<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Modelo semântico sm_vendas_directlake / Semantic model</title>
  <desc id="d">Esquema em estrela em Direct Lake on OneLake: fato_vendas no centro, cinco dimensões ligadas por relacionamentos um-para-muitos, 81 medidas organizadas em seis pastas e o relatório rpt_vendas como consumidor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1620"/><stop offset="1" stop-color="#0f2230"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cd62"/><stop offset="1" stop-color="#d49a1e"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arGo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#f6cd62"/></marker>
    <marker id="arCy2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#4cc9f0"/></marker>
    <marker id="arCo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#ff8a6e"/></marker>
  </defs>
  <style>
    text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .eyebrow{font-size:12px;letter-spacing:.22em;fill:#4cc9f0;font-weight:700}
    .title{font-size:30px;fill:#fff;font-weight:700}
    .sub{font-size:14px;fill:#8fa6b8}
    .cardt{font-size:15px;fill:#fff;font-weight:700}
    .cards{font-size:11.5px;fill:#8fa6b8}
    .tbl{font-family:Consolas,"Cascadia Code",Menlo,monospace;font-size:13px;fill:#fff;font-weight:700}
    .col{font-family:Consolas,"Cascadia Code",Menlo,monospace;font-size:11px;fill:#d7e3ee}
    .key{font-family:Consolas,"Cascadia Code",Menlo,monospace;font-size:11px;fill:#f6cd62}
    .card{font-size:12px;fill:#f6cd62;font-weight:700}
    .grp{font-size:10.5px;letter-spacing:.16em;font-weight:700}
    .bar{font-size:12px;fill:#d7e3ee}
    .num{font-size:12px;fill:#fff;font-weight:700}
    .pill{font-size:12px;fill:#d7e3ee}
    .flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect width="1280" height="660" rx="20" fill="url(#bg)"/>

  <text class="eyebrow" x="40" y="52">MODELO SEMÂNTICO · SEMANTIC MODEL</text>
  <text class="title" x="40" y="90">Um esquema em estrela, lido direto do OneLake</text>
  <text class="sub" x="40" y="116">sm_vendas_directlake · Direct Lake on OneLake · 6 tabelas · 5 relacionamentos · 81 medidas DAX · star schema read straight from OneLake</text>

  <!-- Fonte: lh_gold -->
  <g filter="url(#sh)">
    <rect x="40" y="160" width="250" height="120" rx="14" fill="#13222e" stroke="#8a6a1f"/>
    <path d="M40 174a14 14 0 0 1 14-14h222a14 14 0 0 1 14 14v26H40z" fill="url(#gGold)"/>
  </g>
  <text x="58" y="186" font-size="11" letter-spacing=".2em" font-weight="700" fill="#3d2a00">CAMADA GOLD</text>
  <text class="tbl" x="58" y="226">lh_gold</text>
  <text class="cards" x="58" y="248">6 tabelas Delta no OneLake</text>
  <text class="cards" x="58" y="266">Delta tables in OneLake</text>

  <g filter="url(#sh)"><rect x="40" y="300" width="250" height="200" rx="14" fill="#112b3b" stroke="#1f5a73"/></g>
  <rect x="40" y="300" width="4" height="200" rx="2" fill="#4cc9f0"/>
  <text class="cardt" x="60" y="330">Direct Lake on OneLake</text>
  <text class="cards" x="60" y="354">Lê os arquivos Delta direto,</text>
  <text class="cards" x="60" y="372">sem copiar os dados.</text>
  <text class="cards" x="60" y="396">O "refresh" só atualiza a</text>
  <text class="cards" x="60" y="414">referência à versão da tabela</text>
  <text class="cards" x="60" y="432">(framing): leva segundos.</text>
  <text class="cards" x="60" y="458" fill="#4cc9f0">No copy · framing only ·</text>
  <text class="cards" x="60" y="476" fill="#4cc9f0">no DirectQuery fallback</text>

  <path class="flow" d="M165 282 V296" stroke="#f6cd62" stroke-width="2.4" fill="none" marker-end="url(#arGo)"/>
  <path class="flow" d="M292 375 H526" stroke="#4cc9f0" stroke-width="2.4" fill="none" marker-end="url(#arCy2)"/>

  <!-- Estrela: linhas (desenhadas antes das caixas) -->
  <g stroke="#2f6b85" stroke-width="2" fill="none">
    <path d="M610 238 V318"/>
    <path d="M492 288 L540 330"/>
    <path d="M492 470 L540 420"/>
    <path d="M728 288 L680 330"/>
    <path d="M728 470 L680 420"/>
  </g>
  <g class="card">
    <text x="616" y="256">1</text><text x="616" y="312">*</text>
    <text x="500" y="300">1</text><text x="530" y="324">*</text>
    <text x="500" y="466">1</text><text x="530" y="438">*</text>
    <text x="712" y="300">1</text><text x="684" y="324">*</text>
    <text x="712" y="466">1</text><text x="684" y="438">*</text>
  </g>

  <!-- fato_vendas -->
  <g filter="url(#sh)">
    <rect x="532" y="320" width="156" height="104" rx="14" fill="#2a2412" stroke="#d49a1e" stroke-width="1.5"/>
  </g>
  <text font-size="10" letter-spacing=".2em" font-weight="700" fill="#f6cd62" x="548" y="342">FATO · FACT</text>
  <text class="tbl" x="548" y="364">fato_vendas</text>
  <text class="col" x="548" y="384">33.509 linhas</text>
  <text class="col" x="548" y="402">81 medidas</text>

  <!-- dim_data -->
  <g filter="url(#sh)"><rect x="532" y="160" width="156" height="78" rx="12" fill="#112b3b" stroke="#1f5a73"/></g>
  <text class="tbl" x="548" y="186">dim_data</text>
  <text class="key" x="548" y="206">data</text>
  <text class="col" x="548" y="224">tabela de datas</text>

  <!-- dim_clientes -->
  <g filter="url(#sh)"><rect x="336" y="246" width="156" height="78" rx="12" fill="#112b3b" stroke="#1f5a73"/></g>
  <text class="tbl" x="352" y="272">dim_clientes</text>
  <text class="key" x="352" y="292">cod_cliente</text>
  <text class="col" x="352" y="310">cidade · uf</text>

  <!-- dim_produtos -->
  <g filter="url(#sh)"><rect x="336" y="428" width="156" height="78" rx="12" fill="#112b3b" stroke="#1f5a73"/></g>
  <text class="tbl" x="352" y="454">dim_produtos</text>
  <text class="key" x="352" y="474">cod_produto</text>
  <text class="col" x="352" y="492">família · marca</text>

  <!-- dim_vendedores -->
  <g filter="url(#sh)"><rect x="728" y="246" width="156" height="78" rx="12" fill="#112b3b" stroke="#1f5a73"/></g>
  <text class="tbl" x="744" y="272">dim_vendedores</text>
  <text class="key" x="744" y="292">cod_vendedor</text>
  <text class="col" x="744" y="310">inclui o membro 0</text>

  <!-- dim_empresas -->
  <g filter="url(#sh)"><rect x="728" y="428" width="156" height="78" rx="12" fill="#112b3b" stroke="#1f5a73"/></g>
  <text class="tbl" x="744" y="454">dim_empresas</text>
  <text class="key" x="744" y="474">cod_empresa</text>
  <text class="col" x="744" y="492">empresa usuária</text>

  <!-- Medidas -->
  <g filter="url(#sh)"><rect x="920" y="160" width="320" height="346" rx="14" fill="#14192f" stroke="#2c2f5a"/></g>
  <rect x="920" y="160" width="320" height="6" rx="3" fill="#9b87ff"/>
  <text class="cardt" x="942" y="196">81 medidas em 6 pastas</text>
  <text class="cards" x="942" y="216">81 DAX measures in 6 display folders</text>
  <g>
    <text class="bar" x="942" y="252">1 Vendas</text>
    <rect x="1078" y="241" width="24" height="14" rx="3" fill="#9b87ff"/><text class="num" x="1109" y="253">8</text>
    <text class="bar" x="942" y="282">2 Comparação</text>
    <rect x="1078" y="271" width="30" height="14" rx="3" fill="#9b87ff"/><text class="num" x="1115" y="283">10</text>
    <text class="bar" x="942" y="312">3 Contexto</text>
    <rect x="1078" y="301" width="3" height="14" rx="1.5" fill="#9b87ff"/><text class="num" x="1088" y="313">1</text>
    <text class="bar" x="942" y="342">4 Estornos</text>
    <rect x="1078" y="331" width="21" height="14" rx="3" fill="#9b87ff"/><text class="num" x="1106" y="343">7</text>
    <text class="bar" x="942" y="372">5 Concentração</text>
    <rect x="1078" y="361" width="15" height="14" rx="3" fill="#9b87ff"/><text class="num" x="1100" y="373">5</text>
    <text class="bar" x="942" y="402">6 Textos do relatório</text>
    <rect x="1078" y="391" width="150" height="14" rx="3" fill="#ff8a6e"/><text class="num" x="1205" y="403" text-anchor="end" fill="#2a1410">50</text>
  </g>
  <text class="cards" x="942" y="440">Os títulos do relatório são medidas:</text>
  <text class="cards" x="942" y="458">mudam sozinhos com os dados.</text>
  <text class="cards" x="942" y="482" fill="#ff8a6e">Report titles are DAX measures</text>

  <path class="flow" d="M1080 508 V540" stroke="#ff8a6e" stroke-width="2.4" fill="none" marker-end="url(#arCo)"/>

  <!-- Base: boas praticas + consumo -->
  <g filter="url(#sh)"><rect x="40" y="548" width="1200" height="78" rx="14" fill="#13222e" stroke="#1b303f"/></g>
  <text x="62" y="576" class="grp" fill="#4cc9f0">BOAS PRÁTICAS · GOOD PRACTICES</text>
  <g>
    <rect x="62" y="586" width="168" height="28" rx="8" fill="#1b303f"/><text class="pill" x="76" y="605">Tabela de datas marcada</text>
    <rect x="238" y="586" width="196" height="28" rx="8" fill="#1b303f"/><text class="pill" x="252" y="605">Chaves e data_carga ocultas</text>
    <rect x="442" y="586" width="168" height="28" rx="8" fill="#1b303f"/><text class="pill" x="456" y="605">Só medidas explícitas</text>
    <rect x="618" y="586" width="190" height="28" rx="8" fill="#1b303f"/><text class="pill" x="632" y="605">Mês ordenado pelo número</text>
    <rect x="816" y="586" width="132" height="28" rx="8" fill="#1b303f"/><text class="pill" x="830" y="605">Cultura pt-BR</text>
  </g>
  <rect x="968" y="566" width="252" height="48" rx="10" fill="#2a1a1c" stroke="#7a3a32"/>
  <text x="984" y="586" font-size="10.5" letter-spacing=".16em" font-weight="700" fill="#ff8a6e">CONSUMO</text>
  <text class="tbl" x="984" y="606">rpt_vendas · 3 páginas</text>
</svg>
